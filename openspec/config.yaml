schema: spec-driven

context: |
  Language: Korean
  All artifacts must be written in Korean.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.
  Product: reusable QA execution contracts, interpreter, adapters and CLI.
  Read docs/architecture/repository-audit.md and execution-contract-v0.1.md.
  The counterpart is automated-qa-checker; engine owns all execution schemas.
  Current scope is P1 local runtime and AI-authored Blueprint input.
  ADR 001 selects Node ESM after a real Dart-to-Node browser spike.
  Do not implement Flutter, Slack, organization RBAC or central scheduling here.

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
